services:
  postgres:
    image: postgres:16-alpine
    container_name: openscout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openscout
      POSTGRES_PASSWORD: openscout_dev_password
      POSTGRES_DB: openscout_db
    ports:
      - "5432:5432"
    volumes:
      - openscout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscout -d openscout_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openscout_pgdata:
